<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body{margin:0; padding:0; height:100%; overflow:hidden; background:transparent;}
    .topbar{
      height:72px;
      display:grid;
      grid-template-columns:auto minmax(240px,1fr) auto;
      align-items:center;
      gap:12px;
      padding:8px 12px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .left,.right{display:flex; align-items:center; gap:8px}
    .brand{
      display:flex; align-items:center; gap:10px;
      padding-right:4px;
      margin-right:2px;
    }
    .mark{
      width:28px; height:28px; border-radius:8px; object-fit:cover;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      box-shadow:0 0 0 3px rgba(94,164,255,.12);
    }
    .brand__title{font-weight:900; font-size:12px; line-height:1}
    .brand__sub{font-size:12px; color:var(--subtle); line-height:1.2; letter-spacing:.04em; text-transform:uppercase}

    .center{
      display:grid;
      grid-template-rows:auto auto auto;
      gap:5px;
      min-width:0;
      align-content:center;
    }
    .statusline{
      display:flex; align-items:center; gap:8px; min-width:0;
      font-size:12px; font-weight:700;
    }
    .state{
      display:inline-flex; align-items:center; gap:8px;
      min-width:0;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.02);
      font-size:12px;
      font-weight:800;
      flex:0 0 auto;
    }
    .project{
      min-width:0;
      display:flex;
      align-items:center;
      gap:6px;
      color:var(--muted);
      font-size:12px;
    }
    .project__name{
      color:var(--text);
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:100%;
    }
    .chips{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
      overflow:hidden;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      min-width:0;
      max-width:28%;
      padding:2px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02);
      font-size:12px;
      line-height:1.2;
      white-space:nowrap;
    }
    .chip__k{
      color:var(--subtle);
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
    }
    .chip__v{
      color:var(--text);
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .chip[data-kind="ok"]{
      border-color:rgba(51,213,141,.28);
      background:rgba(51,213,141,.08);
    }
    .chip[data-kind="warn"]{
      border-color:rgba(255,202,95,.30);
      background:rgba(255,202,95,.08);
    }
    .chip[data-kind="muted"] .chip__v{color:var(--muted)}

    .thin{
      width:100%;
      height:4px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.04);
    }
    .bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      transition:width var(--t);
    }

    .dot{
      width:8px; height:8px; border-radius:999px;
      background:#f1f5ff;
      transition:background .2s ease, box-shadow .2s ease;
      box-shadow:0 0 0 2px rgba(255,255,255,.10);
      flex:0 0 auto;
    }
    .dot.dot--idle{
      background:#dce7ff;
      box-shadow:0 0 0 2px rgba(255,255,255,.10);
    }
    .dot.dot--export{
      animation:dotBlink 900ms ease-in-out infinite;
      box-shadow:0 0 8px rgba(255,202,95,.65), 0 0 16px rgba(255,202,95,.28);
    }
    .dot.dot--done{
      background:#31d07f;
      box-shadow:0 0 8px rgba(49,208,127,.45), 0 0 16px rgba(49,208,127,.24);
    }
    .dot.dot--ready{
      background:#31d07f;
      box-shadow:0 0 8px rgba(49,208,127,.45), 0 0 16px rgba(49,208,127,.24);
    }
    .dot.dot--export-indicator{margin-right:6px}
    @keyframes dotBlink{
      0%{background:#ffd240}
      50%{background:#fff1b5}
      100%{background:#ffd240}
    }

    .toggle-btn{
      display:inline-flex;
      align-items:center;
      gap:9px;
      background:none;
      border:none;
      padding:0 4px;
      cursor:pointer;
      font-size:12px;
      color:var(--text);
      border-radius:10px;
    }
    .toggle-btn:hover{background:rgba(255,255,255,.03)}
    .toggle-btn:focus-visible{outline:none; box-shadow:var(--ring)}
    .toggle-btn__track{
      position:relative;
      width:44px;
      height:24px;
      flex:0 0 auto;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,0.06);
      transition: background .15s ease, border-color .15s ease;
    }
    .toggle-btn__thumb{
      position:absolute;
      top:50%;
      left:3px;
      width:18px;
      height:18px;
      border-radius:999px;
      transform: translateY(-50%);
      background: rgba(231,238,252,0.9);
      transition: left .18s ease, background .15s ease;
    }
    .toggle-btn.active .toggle-btn__track{
      background: rgba(94,164,255,0.24);
      border-color: rgba(94,164,255,0.42);
    }
    .toggle-btn.active .toggle-btn__thumb{
      left:23px;
      background: rgba(244,248,255,0.98);
    }
    .toggle-btn__label{user-select:none; color:var(--muted); font-weight:700}

    @media (max-width: 1199px){
      .topbar{
        grid-template-columns:auto minmax(180px,1fr) auto;
        gap:10px;
      }
      #btnProjectSave, #btnProjectLoad{display:none;}
      #chipAudio, #chipCodec{display:none;}
      .brand__sub{display:none;}
      .toggle-btn__label{display:none;}
      .chip{max-width:46%; padding:2px 7px;}
    }
    @media (max-width: 949px){
      .topbar{
        grid-template-columns:auto minmax(120px,1fr) auto;
        gap:8px;
        padding:8px 10px;
      }
      #btnReset{display:none;}
      .brand__title{display:none;}
      .brand{padding-right:0; margin-right:0;}
      .mark{width:26px; height:26px;}
      #chipPreset{display:none;}
      .chip{max-width:none; padding:2px 6px;}
      .chip__k{display:none;}
      .project .muted{display:none;}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="left">
      <div class="brand" title="Auto-Cutter - Voice Cuts">
        <img class="mark" src="../icons/logo/logo.png" alt="Logo" />
        <div>
          <div class="brand__title">Auto-Cutter</div>
          <div class="brand__sub">Voice Cuts</div>
        </div>
      </div>

      <button class="btn btn--secondary" id="btnImport" type="button" aria-label="Import video">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 6px; vertical-align: middle;">
          <path d="M3 8.2C3 7.07989 3 6.51984 3.21799 6.09202C3.40973 5.71569 3.71569 5.40973 4.09202 5.21799C4.51984 5 5.0799 5 6.2 5H9.67452C10.1637 5 10.4083 5 10.6385 5.05526C10.8425 5.10425 11.0376 5.18506 11.2166 5.29472C11.4184 5.4184 11.5914 5.59135 11.9373 5.93726L12.0627 6.06274C12.4086 6.40865 12.5816 6.5816 12.7834 6.70528C12.9624 6.81494 13.1575 6.89575 13.3615 6.94474C13.5917 7 13.8363 7 14.3255 7H17.8C18.9201 7 19.4802 7 19.908 7.21799C20.2843 7.40973 20.5903 7.71569 20.782 8.09202C21 8.51984 21 9.0799 21 10.2V15.8C21 16.9201 21 17.4802 20.782 17.908C20.5903 18.2843 20.2843 18.5903 19.908 18.782C19.4802 19 18.9201 19 17.8 19H6.2C5.07989 19 4.51984 19 4.09202 18.782C3.71569 18.5903 3.40973 18.2843 3.21799 17.908C3 17.4802 3 16.9201 3 15.8V8.2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Import
      </button>

      <button class="btn btn--secondary" id="btnReset" type="button" title="Clear all videos" aria-label="Reset workspace">
        Reset
      </button>

      <button class="btn btn--secondary" id="btnProjectSave" type="button" title="Save .autocutter project" aria-label="Save project">
        Project Save
      </button>

      <button class="btn btn--secondary" id="btnProjectLoad" type="button" title="Load .autocutter project" aria-label="Load project">
        Project Load
      </button>

      <button class="toggle-btn" id="btnSkip" type="button" title="Auto-skip cut sections during preview" aria-label="Auto-skip cuts during preview" aria-pressed="false">
        <span class="toggle-btn__track"><span class="toggle-btn__thumb"></span></span>
        <span class="toggle-btn__label">Auto-skip preview</span>
      </button>
    </div>

    <div class="center">
      <div class="statusline">
        <div class="state" role="status" aria-live="polite">
          <span class="dot dot--idle" id="dotReady"></span>
          <span id="txtState">No video loaded</span>
        </div>
        <div class="project" title="Current project">
          <span class="muted">Project</span>
          <span class="project__name" id="txtProject">-</span>
        </div>
      </div>

      <div class="chips" id="statusChips">
        <div class="chip" id="chipVideo" title="Video availability"><span class="chip__k">Video</span><span class="chip__v">Missing</span></div>
        <div class="chip" id="chipAudio" title="Audio timeline status"><span class="chip__k">Audio</span><span class="chip__v">-</span></div>
        <div class="chip" id="chipPreset" title="Current preset"><span class="chip__k">Preset</span><span class="chip__v">Manual</span></div>
        <div class="chip" id="chipCodec" title="Export codec"><span class="chip__k">Codec</span><span class="chip__v">H.264</span></div>
      </div>

      <div class="thin" id="progressTrack" role="progressbar" aria-label="Analysis or export progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="prog"></div></div>
    </div>

    <div class="right">
      <button class="btn btn--primary" id="btnExport" type="button" aria-label="Export MP4">
        <span class="dot dot--idle dot--export-indicator" id="dotExport"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 6px; vertical-align: middle;">
          <path opacity="0.5" d="M4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12 14L12 4M12 4L15 7M12 4L9 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Export
      </button>

      <button class="iconbtn" id="btnMenu" type="button" title="Settings and shortcuts" aria-label="Settings and help">...</button>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    let bridge = null;

    function setState(text){
      const el = document.getElementById("txtState");
      if (el) el.textContent = text || "Ready";
    }
    function setCrumbs(videoName){
      const el = document.getElementById("txtProject");
      if (el) el.textContent = (videoName || "-");
    }
    function setProgress(p){
      const value = Math.max(0, Math.min(100, Number(p) || 0));
      const el = document.getElementById("prog");
      if (el) el.style.width = value + "%";
      const track = document.getElementById("progressTrack");
      if (track) track.setAttribute("aria-valuenow", String(value));
    }
    function setStatusChip(id, value, kind){
      const chip = document.getElementById(id);
      if (!chip) return;
      const v = chip.querySelector(".chip__v");
      if (v) v.textContent = String(value ?? "-");
      chip.dataset.kind = kind || "muted";
    }

    let skipEnabled = true;

    new QWebChannel(qt.webChannelTransport, function(channel){
      bridge = channel.objects.bridge;

      const btnSkip = document.getElementById("btnSkip");

      document.getElementById("btnImport").onclick = () => bridge.importClicked();
      document.getElementById("btnReset").onclick = () => bridge.resetClicked();
      document.getElementById("btnProjectSave").onclick = () => bridge.projectSaveClicked();
      document.getElementById("btnProjectLoad").onclick = () => bridge.projectLoadClicked();
      document.getElementById("btnExport").onclick = () => bridge.exportClicked();

      btnSkip.onclick = (e) => {
        e.stopPropagation();
        skipEnabled = !skipEnabled;
        btnSkip.classList.toggle("active", skipEnabled);
        btnSkip.setAttribute("aria-pressed", skipEnabled ? "true" : "false");
        bridge.autoSkipChanged(skipEnabled);
      };
      document.getElementById("btnMenu").onclick = () => bridge.openMenu();

      btnSkip.classList.toggle("active", skipEnabled);
      btnSkip.setAttribute("aria-pressed", skipEnabled ? "true" : "false");
      bridge.requestUiState();
    });

    // called by python
    window.uiSetState = function(s){ setState(s); }
    window.uiSetCrumbs = function(name){ setCrumbs(name); }
    window.uiSetProgress = function(p){ setProgress(p); }
    window.uiSetSkip = function(v){
      const btnSkip = document.getElementById("btnSkip");
      if (!btnSkip) return;
      skipEnabled = !!v;
      btnSkip.classList.toggle("active", skipEnabled);
      btnSkip.setAttribute("aria-pressed", skipEnabled ? "true" : "false");
    }
    window.uiSetStatusChips = function(payload){
      const data = payload || {};
      setStatusChip("chipVideo", data.video || "-", data.video_kind || "muted");
      setStatusChip("chipAudio", data.audio || "-", data.audio_kind || "muted");
      setStatusChip("chipPreset", data.preset || "Manual", data.preset_kind || "muted");
      setStatusChip("chipCodec", data.codec || "-", data.codec_kind || "info");
    }
    window.uiSetReadyDotState = function(state){
      const dot = document.getElementById("dotReady");
      if (!dot) return;
      dot.classList.remove("dot--idle", "dot--ready");
      if (state === "ready") dot.classList.add("dot--ready");
      else dot.classList.add("dot--idle");
    }
    window.uiSetExportDotState = function(state){
      const dot = document.getElementById("dotExport");
      if (!dot) return;
      dot.classList.remove("dot--idle", "dot--export", "dot--done");
      if (state === "export") dot.classList.add("dot--export");
      else if (state === "done") dot.classList.add("dot--done");
      else dot.classList.add("dot--idle");
    }
    window.uiSetVideoLoaded = function(_loaded){
      window.uiSetReadyDotState("idle");
      window.uiSetExportDotState("idle");
    }
  </script>
</body>
</html>
